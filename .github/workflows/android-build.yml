name: Build Android App (Google Play & APK)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    name: Build & Package Android App
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install web dependencies
        run: npm ci

      - name: ⚡ Build Vite production bundle
        run: npm run build

      - name: 🔄 Sync Capacitor Android project
        run: npx cap sync android

      - name: 📱 Accept Android SDK Licenses & Install Platform 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: 🔑 Configure Release Keystore
        run: |
          mkdir -p android/app/keystores
          echo "" | base64 --decode > android/app/keystores/fidelipass-upload-key.jks
          echo "Keystore successfully configured."

      - name: 🛠️ Set executable permissions for gradlew
        run: chmod +x android/gradlew

      - name: 🤖 Build & Sign Android App Bundle (.aab) & APK
        run: |
          cd android
          ./gradlew bundleRelease assembleRelease

          cd ..
          mkdir -p build-android
          cp android/app/build/outputs/bundle/release/app-release.aab build-android/FideliPass.aab
          cp android/app/build/outputs/apk/release/app-release.apk build-android/FideliPass.apk
          cp android/app/keystores/fidelipass-upload-key.jks build-android/fidelipass-upload-key.jks
          echo "✅ FideliPass.aab and FideliPass.apk successfully built and signed!"

      - name: 💾 Save AAB as Downloadable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FideliPass-Android-AAB
          path: build-android/FideliPass.aab
          retention-days: 14

      - name: 💾 Save APK as Downloadable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FideliPass-Android-APK
          path: build-android/FideliPass.apk
          retention-days: 14

      - name: 🚀 Publish Android Release on GitHub
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          name: FideliPass Android v1.0 (Build ${{ github.run_number }})
          body: |
            ### 🤖 FideliPass Android Build ${{ github.run_number }}
            Archivos oficiales para Android:
            - 📦 **Paquete oficial Google Play Store**: `FideliPass.aab`
            - 📱 **Instalador directo para celulares / emulador**: `FideliPass.apk`
            - 🔑 **Llave de firma (Keystore)**: `fidelipass-upload-key.jks`
            - **Package ID**: `com.fidelipassapp.business`
          files: |
            build-android/FideliPass.aab
            build-android/FideliPass.apk
            build-android/fidelipass-upload-key.jks
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
