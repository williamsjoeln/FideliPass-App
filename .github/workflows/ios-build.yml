name: Build iOS App (App Store & TestFlight)

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: 'Upload directly to App Store Connect / TestFlight'
        required: false
        type: boolean
        default: true

jobs:
  build:
    name: Build & Package iOS App
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install web dependencies
        run: npm ci

      - name: ⚡ Build Vite production bundle
        run: npm run build

      - name: 🔄 Sync Capacitor iOS project
        run: npx cap sync ios

      - name: 🔐 Install Apple Certificate & Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'build123' }}
        run: |
          if [ -n "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "Installing Apple Certificate..."
            CERT_PATH=$RUNNER_TEMP/build_certificate.p12
            PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
            KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

            echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERT_PATH
            echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

            security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
            security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

            security import $CERT_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
            security list-keychain -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | sed -e 's/"//g')

            # Extract UUID and copy profile
            PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(security cms -D -i $PP_PATH))
            echo "Provisioning Profile UUID: $PROFILE_UUID"
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/${PROFILE_UUID}.mobileprovision
            echo "PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV
            echo "✅ Certificate and Provisioning Profile installed successfully!"
          else
            echo "⚠️ No signing certificate found in secrets, continuing in ad-hoc mode."
          fi

      - name: 🔨 Build iOS Archive (.xcarchive)
        env:
          HAS_CERT: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
        run: |
          if [ -d "ios/App/App.xcworkspace" ]; then
            TARGET_FLAG="-workspace ios/App/App.xcworkspace"
          else
            TARGET_FLAG="-project ios/App/App.xcodeproj"
          fi

          if [ -n "$HAS_CERT" ]; then
            echo "Building with Apple Code Signing for Team H79W4YK96D..."
            xcodebuild archive \
              $TARGET_FLAG \
              -scheme App \
              -destination "generic/platform=iOS" \
              -configuration Release \
              -archivePath build/App.xcarchive \
              DEVELOPMENT_TEAM=H79W4YK96D \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="Apple Distribution" \
              PROVISIONING_PROFILE="${{ env.PROFILE_UUID || 'dc1c1ffd-78b7-48fc-97b6-6d9f3e3ebd3e' }}" \
              PROVISIONING_PROFILE_SPECIFIER="FideliPass AppStore"
          else
            echo "Building ad-hoc unsigned..."
            xcodebuild archive \
              $TARGET_FLAG \
              -scheme App \
              -destination "generic/platform=iOS" \
              -configuration Release \
              -archivePath build/App.xcarchive \
              CODE_SIGN_ALLOWED=NO \
              CODE_SIGN_REQUIRED=NO
          fi

      - name: 📦 Package .ipa file
        run: |
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
          if [ -f "$RUNNER_TEMP/build_pp.mobileprovision" ]; then
            cp "$RUNNER_TEMP/build_pp.mobileprovision" build/Payload/App.app/embedded.mobileprovision
          fi
          cd build && zip -r -9 FideliPass.ipa Payload
          echo "✅ FideliPass.ipa packaged successfully!"

      - name: 🚀 Upload directly to App Store Connect / TestFlight
        if: ${{ github.event.inputs.upload_to_testflight == 'true' }}
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
        run: |
          if [ -z "$KEY_CONTENT" ]; then
            echo "⚠️ No App Store Connect API Key found in secrets. Skipping upload."
            exit 0
          fi

          echo "🔑 Setting up App Store Connect API Key..."
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$KEY_CONTENT" > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8

          echo "🔍 Validating IPA with Apple App Store Connect..."
          xcrun altool --validate-app -f build/FideliPass.ipa -t ios --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID" --show-progress

          echo "🚀 Uploading IPA to Apple App Store Connect..."
          xcrun altool --upload-app -f build/FideliPass.ipa -t ios --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID" --show-progress
          echo "🎉 Successfully uploaded FideliPass to App Store Connect / TestFlight!"

      - name: 💾 Save IPA as Downloadable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FideliPass-iOS-App
          path: build/FideliPass.ipa
          retention-days: 14

      - name: 🚀 Publish GitHub Release with IPA
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: FideliPass iOS v1.0 (Build ${{ github.run_number }})
          body: |
            ### 📱 FideliPass iOS Build ${{ github.run_number }}
            Archivo de instalación oficial para iOS:
            - **Archivo**: `FideliPass.ipa`
            - **Bundle ID**: `com.fidelipassapp.business`
            - **Plataforma**: iOS (Apple App Store / TestFlight)
          files: build/FideliPass.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
