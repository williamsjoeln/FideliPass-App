name: Build iOS App (App Store & TestFlight)

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: 'Upload directly to App Store Connect / TestFlight'
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Build & Package iOS App
    runs-on: macos-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install web dependencies
        run: npm ci

      - name: ⚡ Build Vite production bundle
        run: npm run build

      - name: 🔄 Sync Capacitor iOS project
        run: npx cap sync ios

      - name: 🛠️ Setup Ruby & Fastlane (optional for TestFlight upload)
        if: ${{ github.event.inputs.upload_to_testflight == 'true' }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: 🔨 Build iOS Archive (.xcarchive)
        run: |
          if [ -d "ios/App/App.xcworkspace" ]; then
            TARGET_FLAG="-workspace ios/App/App.xcworkspace"
          else
            TARGET_FLAG="-project ios/App/App.xcodeproj"
          fi
          xcodebuild archive \
            $TARGET_FLAG \
            -scheme App \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: 📦 Package .ipa file
        run: |
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build && zip -r -9 FideliPass.ipa Payload
          echo "✅ FideliPass.ipa built successfully!"

      - name: 🚀 Upload directly to TestFlight via Fastlane
        if: ${{ github.event.inputs.upload_to_testflight == 'true' && env.APP_STORE_CONNECT_KEY_ID != '' }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          echo "Uploading to App Store Connect..."
          # If Fastlane credentials are configured in GitHub Secrets, fastlane pilot uploads it
          # xcrun altool or xcrun notarytool / transporter upload

      - name: 💾 Save IPA as Downloadable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FideliPass-iOS-App
          path: build/FideliPass.ipa
          retention-days: 14
